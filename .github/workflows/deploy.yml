name: Deploy to GitHub Pages

  on:
    push:
      branches:
        - main

  permissions:
    contents: write

  jobs:
    deploy:
      runs-on: ubuntu-latest

      steps:
        - uses: actions/checkout@v4

        - uses: actions/setup-node@v4
          with:
            node-version: 20

        - name: Install dependencies
          run: npm install

        - name: Build
          run: npm run build

        - name: Copy dist to docs
          run: |
            rm -rf docs
            cp -r dist/. docs/
            # Preserve CNAME so custom domain stays
            echo "maxxtech.co.ke" > docs/CNAME

        - name: Commit and push docs
          run: |
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add docs/
            git diff --cached --quiet || git commit -m "Deploy: update docs from build"
            git push
  